# Environment
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT_STYLE_OVERRIDE,qt5ct-style
env=QT_QPA_PLATFORM,wayland
env=GDK_BACKEND,wayland
env=EDITOR,nvim
env=XCURSOR_THEME,catppuccin-mocha-pink-cursors
env=XCURSOR_SIZE,24
env=WLR_NO_HARDWARE_CURSORS,1

# Startup
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=quickshell --daemonize --no-duplicate
exec-once=mako
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=systemctl --user start wlsunset.service
exec-once=systemctl --user start sway-audio-idle-inhibit.service
exec-once=swayidle -w timeout 300 'swaylock -f -c 000000' timeout 330 'wlopm --off \*' resume 'wlopm --on \*' timeout 900 'systemctl suspend-then-hibernate' before-sleep 'swaylock -f -c 000000'

# Displays
# Laptop
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,vrr:1,rr:0

# Desktop — same relative layout as Hyprland, shifted into +x/+y for XWayland
# Hyprland: DP-2 -1200x-240 (transform 3), DP-3 0x0, DP-1 2560x180
# ASUS BE24A portrait (left)
monitorrule=name:^DP-2$,width:1920,height:1200,refresh:59.95,x:0,y:0,scale:1,vrr:0,rr:3
# AOC Q27G42XE 1440p main
monitorrule=name:^DP-3$,width:2560,height:1440,refresh:180,x:1200,y:240,scale:1,vrr:1,rr:0
# AOC 24G4 1080p (right)
monitorrule=name:^DP-1$,width:1920,height:1080,refresh:180,x:3760,y:420,scale:1,vrr:1,rr:0

# Desktop startup placements (Hyprland: zen → ws3/DP-3, equibop → ws2/DP-2)
# Chassis type 3 = desktop; skip on laptop
windowrule=tags:1,monitor:DP-3,isopensilent:1,appid:zen
windowrule=tags:1,monitor:DP-2,isopensilent:1,appid:equibop
exec-once=sh -c 'grep -qx 3 /sys/class/dmi/id/chassis_type || exit 0; sleep 0.5; zen-browser & equibop & sleep 1; mmsg dispatch focusmon,DP-2'

# Input
xkb_rules_layout=pl
sloppyfocus=1
warpcursor=0
mouse_accel_speed=0
mouse_natural_scrolling=0
trackpad_natural_scrolling=0
cursor_size=24

# Layout and appearance
gappih=2
gappiv=2
gappoh=3
gappov=3
borderpx=1
border_radius=2
focused_opacity=1.0
unfocused_opacity=1.0
blur=0
blur_layer=0
shadows=0
layer_shadows=0
rootcolor=0x11111bff
focuscolor=0xcba6f7ff
bordercolor=0x45475aff
dwindle_preserve_split=1
allow_tearing=1

tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle

# Animations
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
zoom_initial_ratio=0.87
zoom_end_ratio=0.87
animation_duration_move=479
animation_duration_open=410
animation_duration_close=149
animation_duration_tag=194
animation_duration_focus=0
animation_curve_open=0.23,1,0.32,1
animation_curve_move=0.23,1,0.32,1
animation_curve_tag=0.5,0.5,0.75,1
animation_curve_close=0,0,1,1
animation_curve_focus=0.23,1,0.32,1
animation_curve_opafadein=0.5,0.5,0.75,1
animation_curve_opafadeout=0.5,0.5,0.75,1

# Applications and compositor actions
bind=SUPER,Q,spawn,kitty
bind=SUPER,C,killclient
bind=SUPER,M,spawn,wlogout
bind=SUPER,E,spawn,thunar
bind=SUPER,V,togglefloating
bind=SUPER,R,spawn,wofi --conf /home/nyx/.config/wofi/config --style /home/nyx/.config/wofi/style.css
bind=SUPER,F,spawn,zen-browser
bind=SUPER+SHIFT,R,reload_config

# Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Tags (Mango supports tags 1 through 9)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

# Pointer window manipulation
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Media and brightness
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 2%-
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# Screenshots, lock, and color picker
bind=NONE,Print,spawn,/home/nyx/.config/mango/screenshot area
bind=SUPER+CTRL,R,spawn,/home/nyx/.config/mango/screenshot window
bind=SUPER+CTRL,T,spawn,/home/nyx/.config/mango/screenshot output
bind=SUPER+CTRL,L,spawn,swaylock -c 000000
bind=SUPER+CTRL,X,spawn,hyprpicker -a -n
bind=NONE,XF86PowerOff,spawn,wlogout

layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:wofi
layerrule=noanim:1,noblur:1,layer_name:selection
